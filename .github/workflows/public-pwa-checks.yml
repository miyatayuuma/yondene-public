name: Public PWA checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: public-pwa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check public data boundary
        run: node scripts/check-public-boundary.mjs
      - name: Test GAS queue safety with fake data
        run: node --test gas/queue.test.mjs gas/production-read-probe.test.mjs gas/production-commit-probe.test.mjs gas/production-cleanup-probe.test.mjs gas/production-rename-probe.test.mjs
      - name: Test app domain and PWA
        working-directory: reading-shelf-firebase
        run: >-
          node --test
          activity.test.mjs
          bibliography-identity.test.mjs
          book-forest-ai-provider.test.mjs
          book-forest-cloudflare-provider.test.mjs
          book-forest-conversation-log.test.mjs
          book-forest-cache.test.mjs
          book-forest-dialogue-director.test.mjs
          book-forest-dialogue-generation.test.mjs
          book-forest-twins.test.mjs
          book-forest-drive.test.mjs
          book-forest-private-dialogue.test.mjs
          book-forest-story-memory.test.mjs
          book-forest-world.test.mjs
          book-forest-lifecycle.test.mjs
          book-forest-live-dialogue.test.mjs
          book-forest-thought-seeds.test.mjs
          book-forest-thought-sync.test.mjs
          book-forest-scene.test.mjs
          cover-thumbnails.test.mjs
          domain.test.mjs
          invite-links.test.mjs
          nickname.test.mjs
          pending-reflections.test.mjs
          pwa.test.mjs
          reader-name.test.mjs
          reading-record-domain.test.mjs
          startup-recovery.test.mjs
      - name: Test Cloudflare forest AI Worker without external API calls
        run: node --test cloudflare/forest-ai/src/index.test.mjs
  rules:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase emulator tooling
        working-directory: reading-shelf-firebase
        run: npm install --no-audit --no-fund
      - name: Test Firestore security rules locally
        working-directory: reading-shelf-firebase
        run: npx firebase emulators:exec --only firestore --project demo-reading-shelf-rules "node --test firestore.rules.test.mjs"
