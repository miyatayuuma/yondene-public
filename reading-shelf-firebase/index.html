<!doctype html>
<html lang="ja" data-app-build="20261019-shelf-v28"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF8EF">
<meta name="application-name" content="よんでね">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="よんでね">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="description" content="読書の記録を安全に共有する本棚">
<title>よんでね</title>
<link rel="stylesheet" href="./style.css?build=20261019-shelf-v28">
</head><body>
<header><div class="top">
  <div class="logo"><img class="logoIcon" alt="" src="./icon.svg"><div>よんでね<small id="shelfBrand">家族のほんだな</small></div></div>
  <div class="headerActions"><button id="installApp" class="installApp" hidden>アプリを追加</button><button id="familySettings" class="iconButton" hidden aria-label="設定" title="設定">⚙</button><span id="identity" aria-live="polite"></span><button id="signOut" hidden>ログアウト</button></div>
</div></header>
<main>
  <section class="hero"><h1 id="shelfName">本棚</h1><p>読書の記録と思い出。</p></section>
  <div id="message" role="alert" class="notice" hidden></div>
  <section id="loading" class="panel center"><p>データを確認しています…</p></section>
  <section id="loginPanel" class="panel center" hidden><h2>Googleアカウントでログイン</h2><p>一度ログインすると、同じ端末では原則として次回から自動で接続します。</p><button class="primary" id="googleLogin">Googleでログイン</button><p class="muted tiny">このURLを知っているだけでは読書記録は見られません。</p></section>
  <section id="setupPanel" class="panel" hidden><h2 id="setupTitle">本棚に参加</h2><p id="setupDesc">管理者から受け取った招待URLでログインしてください。</p><div id="setupBody"></div></section>
  <section id="shelfPanel" hidden>
    <div class="stats"><div><strong id="readCount">0</strong><span>読んだ本</span></div><div><strong id="totalCount">0</strong><span>登録した本</span></div><div><strong id="seriesCount">0</strong><span>シリーズ</span></div></div>
    <nav class="tabs" aria-label="表示切替">
      <button data-view="shelf" class="active">本棚</button><button data-view="series">シリーズ</button><button data-view="recommendations">おすすめ</button>
    </nav>
    <div id="bookControls" class="controls" aria-label="本をさがす・並べる">
      <input id="search" type="search" placeholder="タイトル・作者で検索" aria-label="本のタイトル・作者で検索">
      <div class="bookSelectRow">
        <label class="fieldLabel"><span class="srOnly">表示する本</span>
          <select id="filter" aria-label="表示する本">
            <option value="active-read">読んでる・読んだ</option>
            <option value="all">すべての本</option>
            <option value="paused">お休み中の本</option>
            <option value="unread">きになる</option>
          </select>
        </label>
        <label class="fieldLabel"><span class="srOnly">並び順</span>
          <select id="sort" aria-label="並び順">
            <option value="order-new">最近読んだ順</option>
            <option value="order-old">最初に読んだ順</option>
            <option value="title-asc">タイトル順</option>
            <option value="author-asc">作者順</option>
            <option value="year-new">出版年：新しい順</option>
            <option value="year-old">出版年：古い順</option>
            <option value="rating-high">★の多い順</option>
          </select>
        </label>
      </div>
    </div>
    <div id="activityMount" hidden></div>
    <div id="content" aria-live="polite"></div>
  </section>
</main>
<dialog id="bookInfoDialog" aria-labelledby="bookInfoTitle">
  <div class="dialogInner">
    <div class="dialogTop"><h2 id="bookInfoTitle">本の詳細</h2><button type="button" class="ghost" data-close="bookInfoDialog" aria-label="閉じる">×</button></div>
    <div id="bookInfoBody"></div>
  </div>
</dialog>
<script type="module" src="./app.mjs?build=20261019-shelf-v28"></script>
</body></html>
