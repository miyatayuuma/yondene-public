name: Public PWA checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: public-pwa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check public data boundary
        run: node scripts/check-public-boundary.mjs
      - name: Test the PWA, GAS and Worker
        working-directory: reading-shelf-firebase
        run: npm test
      - name: Verify Worker bundle includes the shared character registry
        working-directory: cloudflare/forest-ai
        run: npx --yes wrangler@4 deploy ./src/index.mjs --config ./wrangler.toml --name yondene-forest-ai --dry-run --outdir /tmp/forest-worker-bundle
  rules:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase emulator tooling
        working-directory: reading-shelf-firebase
        run: npm install --no-audit --no-fund
      - name: Test Firestore security rules locally
        working-directory: reading-shelf-firebase
        run: npm run test:rules
