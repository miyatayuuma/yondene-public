name: Public PWA checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: public-pwa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check public data boundary
        run: node scripts/check-public-boundary.mjs
      - name: Test GAS queue safety with fake data
        run: node --test gas/queue.test.mjs gas/production-read-probe.test.mjs
      - name: Test app domain and PWA
        working-directory: reading-shelf-firebase
        run: >-
          node --test
          activity.test.mjs
          bibliography-identity.test.mjs
          cover-thumbnails.test.mjs
          domain.test.mjs
          invite-links.test.mjs
          nickname.test.mjs
          pending-reflections.test.mjs
          pwa.test.mjs
          reader-name.test.mjs
          reading-record-domain.test.mjs
          startup-recovery.test.mjs
  rules:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase emulator tooling
        working-directory: reading-shelf-firebase
        run: npm install --no-audit --no-fund
      - name: Test Firestore security rules locally
        working-directory: reading-shelf-firebase
        run: npx firebase emulators:exec --only firestore --project demo-reading-shelf-rules "node --test firestore.rules.test.mjs"
